<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <!-- Boundary: machine hosting the Streamlit server -->
  <rect x="190" y="20" width="790" height="520" rx="14" fill="#F7F8FB" stroke="#94A3B8" stroke-dasharray="7 5"/>
  <text x="210" y="46" font-size="15" fill="#475569" font-weight="600">Machine hosting the Streamlit server (all processing is offline and local to this host)</text>

  <!-- Input -->
  <rect x="20" y="210" width="150" height="110" rx="10" fill="#EEF2FF" stroke="#3554F5" stroke-width="1.5"/>
  <text x="95" y="244" font-size="15" text-anchor="middle" font-weight="700" fill="#1E293B">Saved capture</text>
  <text x="95" y="266" font-size="13" text-anchor="middle" fill="#334155">.pcap / .pcapng</text>
  <text x="95" y="286" font-size="12" text-anchor="middle" fill="#64748B">(Wireshark or</text>
  <text x="95" y="302" font-size="12" text-anchor="middle" fill="#64748B">synthetic demo file)</text>

  <!-- Upload / sample selector -->
  <rect x="215" y="200" width="170" height="130" rx="10" fill="#ffffff" stroke="#3554F5" stroke-width="1.5"/>
  <text x="300" y="228" font-size="15" text-anchor="middle" font-weight="700" fill="#1E293B">app.py</text>
  <text x="300" y="250" font-size="13" text-anchor="middle" fill="#334155">Sidebar upload or</text>
  <text x="300" y="268" font-size="13" text-anchor="middle" fill="#334155">"Use sample capture"</text>
  <text x="300" y="290" font-size="12" text-anchor="middle" fill="#64748B">suffix + 25 MB check,</text>
  <text x="300" y="306" font-size="12" text-anchor="middle" fill="#64748B">temporary file written</text>

  <!-- Parser -->
  <rect x="415" y="80" width="190" height="150" rx="10" fill="#ffffff" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="510" y="108" font-size="15" text-anchor="middle" font-weight="700" fill="#1E293B">packet_parser.py</text>
  <text x="510" y="132" font-size="13" text-anchor="middle" fill="#334155">1. Magic-number check</text>
  <text x="510" y="152" font-size="13" text-anchor="middle" fill="#334155">2. Scapy PcapReader,</text>
  <text x="510" y="170" font-size="13" text-anchor="middle" fill="#334155">packet by packet</text>
  <text x="510" y="190" font-size="13" text-anchor="middle" fill="#334155">3. Header metadata</text>
  <text x="510" y="210" font-size="12" text-anchor="middle" fill="#64748B">4. Truncation check</text>

  <!-- Classifier -->
  <rect x="415" y="300" width="190" height="120" rx="10" fill="#ffffff" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="510" y="328" font-size="15" text-anchor="middle" font-weight="700" fill="#1E293B">protocol_analyzer.py</text>
  <text x="510" y="352" font-size="13" text-anchor="middle" fill="#334155">Network: IPv4/IPv6/ARP</text>
  <text x="510" y="372" font-size="13" text-anchor="middle" fill="#334155">Transport: TCP/UDP/ICMP/v6</text>
  <text x="510" y="392" font-size="13" text-anchor="middle" fill="#334155">Application: DNS</text>

  <!-- DataFrame -->
  <rect x="635" y="200" width="150" height="130" rx="10" fill="#ECFDF5" stroke="#0E9F8E" stroke-width="1.5"/>
  <text x="710" y="232" font-size="15" text-anchor="middle" font-weight="700" fill="#1E293B">Pandas</text>
  <text x="710" y="252" font-size="15" text-anchor="middle" font-weight="700" fill="#1E293B">DataFrame</text>
  <text x="710" y="276" font-size="13" text-anchor="middle" fill="#334155">one metadata row</text>
  <text x="710" y="294" font-size="13" text-anchor="middle" fill="#334155">per packet</text>
  <text x="710" y="314" font-size="12" text-anchor="middle" fill="#64748B">temp file deleted</text>

  <!-- Filters / statistics -->
  <rect x="815" y="90" width="150" height="90" rx="10" fill="#ffffff" stroke="#0E9F8E" stroke-width="1.5"/>
  <text x="890" y="120" font-size="15" text-anchor="middle" font-weight="700" fill="#1E293B">filters.py</text>
  <text x="890" y="142" font-size="12.5" text-anchor="middle" fill="#334155">protocol OR,</text>
  <text x="890" y="160" font-size="12.5" text-anchor="middle" fill="#334155">AND with IP text</text>
  <rect x="815" y="350" width="150" height="90" rx="10" fill="#ffffff" stroke="#0E9F8E" stroke-width="1.5"/>
  <text x="890" y="378" font-size="14" text-anchor="middle" font-weight="700" fill="#1E293B">traffic_statistics</text>
  <text x="890" y="400" font-size="12.5" text-anchor="middle" fill="#334155">KPIs, top IPs, flags,</text>
  <text x="890" y="418" font-size="12.5" text-anchor="middle" fill="#334155">handshakes, ICMP, DNS</text>

  <!-- Output screens -->
  <rect x="215" y="455" width="750" height="65" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="590" y="478" font-size="15" text-anchor="middle" font-weight="700" fill="#1E293B">ui.py renders three analysis screens</text>
  <text x="590" y="502" font-size="12" text-anchor="middle" fill="#334155">Overview (KPIs, layer charts, top talkers)  ·  Packet Explorer (filters, table, layer cards)  ·  Protocol Analysis (tables, TCP, ICMP, DNS)</text>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="170" y1="265" x2="213" y2="265"/>
    <path d="M385,240 L400,240 L400,155 L413,155"/>
    <line x1="510" y1="230" x2="510" y2="298"/>
    <path d="M605,155 L620,155 L620,240 L633,240"/>
    <path d="M605,360 L620,360 L620,300 L633,300"/>
    <path d="M785,230 L800,230 L800,135 L813,135"/>
    <path d="M785,300 L800,300 L800,395 L813,395"/>
    <path d="M890,180 L890,195 L975,195 L975,487 L967,487"/>
    <line x1="890" y1="440" x2="890" y2="453"/>
    <path d="M710,330 L710,453"/>
  </g>
  <g font-size="11.5" fill="#64748B">
    <text x="520" y="268">classify</text>
    <text x="300" y="350" text-anchor="middle">error → readable sidebar message</text>
  </g>
</svg>
